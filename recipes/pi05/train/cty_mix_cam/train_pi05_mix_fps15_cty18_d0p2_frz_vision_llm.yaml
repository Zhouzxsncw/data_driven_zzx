# π0.5 mix_108_36_91_73，cty-18，8 卡。原生 15Hz，不抽帧。
# 动作相对观测晚 0.2s。15 Hz 上是观测留在 t，动作块从 t+3 开始。
# trainable_modules: action = 冻住 PaliGemma（视觉塔、图像投影、语言模型），
# 训动作专家 gemma_expert 以及 action_in_proj / action_out_proj / time_mlp。
# 全局 batch 768，峰值学习率 1e-4，和已停的 d0p2 整网同一档。
config_name: pi05_aloha
framework: pytorch

exp_name: mix_108_36_91_73_PI05_cty18_bs768_ah50_fps15_d0p2_frz_vision_llm
project_name: openpi
checkpoint_base_dir: /workspace/outputs
assets_base_dir: ./assets

batch_size: 768
num_epochs: 10
seed: 42
num_workers: 16
log_interval: 100
save_every_epochs: 1
keep_period: 5000
overwrite: false
resume: false
wandb_enabled: false
fsdp_devices: 8
ema_decay: 0.99
trainable_modules: action

pytorch_training_precision: bfloat16
pytorch_weight_path: /workspace/openpi/models/pi05_fixed

model:
  action_horizon: 50

lr_schedule:
  warmup_steps: 250
  peak_lr: 1.0e-4
  decay_lr: 1.0e-5
  decay_steps: 124300

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

data:
  repo_id: /workspace/openpi/datasets/mix_108_36_91_73
  target_fps: 15
  # 0.2s × 15 Hz → 3 帧。观测留在 t，动作块从 t+3 开始。
  action_delay_sec: 0.2
  assets:
    assets_dir: /workspace/openpi/assets/mix_108_36_91_73_d7171_train
    asset_id: "."
  default_prompt: "With both hands, pick up the yellow banana and the yellow lemon and put them into the black box; then take the green vegetables and place them into the blue box."
  prompt_from_task: true
  prompt_from_subtask: false
  adapt_to_pi: false
  delta_action_dims: [7, -1, 7, -1]
  interleave_grippers: true
  val_ratio: 0.1
  val_seed: 42
  image_keys:
    - observation.images.front
    - observation.images.left
    - observation.images.right
  drop_cameras: []
