  task_prompt_presets:
  - id: task108
    label: "108 香蕉柠檬/青菜分盒（当前默认 prompt）"
    task_prompt: "With both hands, pick up the yellow banana and the yellow lemon and put them into the black box; then take the green vegetables and place them into the blue box."
  - id: task073
    label: "073 传送带快递分拣"
    task_prompt: "Using both hands, pick up the courier items from the green conveyor belt. Place the white courier bags into the left box and the brown courier boxes into the right box."
  - id: task091
    label: "091 蓝把手抽屉药盒"
    task_prompt: "Using both hands, pull open the drawer with the blue handle using your left hand, take out the white medicine box with your right hand, place it into the green drawer, and finally close the drawer."
  - id: task112
    label: "112 蓝抽屉黄药盒 + 绿盒白药盒"
    task_prompt: "Using both hands, open the blue drawer with the black handle, put the yellow medicine box into it, and close the drawer. Then open the light green box with the blue handle, put the white medicine box with the green label into it, and close the box."
