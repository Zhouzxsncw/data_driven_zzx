# 天翼云 cty-19 · 00073 10Hz。2026-09-28 从 step 3370 续训。
# 旧一对：global 384（每卡 48，显存约 52GB / 35%）、peak 1.5e-4、decay 1.5e-5。
# 每卡 120（global 960）实测 81793/147456 MiB（55%）。固定约 32GB，其余按每卡样本线性涨。
# 每卡 240（global 1920）按这条斜率落到约 89%。peak/decay 乘 √(1920/384)=√5 → 3.35e-4 / 3.35e-5。
# 不设 num_epochs，避免启动改写 decay_steps。剩余样本按新 batch 折成步数，step 3370 仍落在原来的余弦进度上。
# 总样本仍是原来 100 epoch（33700×384）。
# 启动：YAML=configs/train_pi05_ppu8_00073_fps10.yaml GPUS=0,1,2,3,4,5,6,7 PORT=29701 \
#       NPROC=8 LOG=/workspace/openpi/train_00073_ppu8_fps10.log bash scripts/start_train_ppu8.sh
config_name: pi05_aloha
framework: pytorch

exp_name: 00073_PI05_ppu8_bs384_ah50_fps10_20260927
project_name: openpi
checkpoint_base_dir: /workspace/outputs
assets_base_dir: ./assets

batch_size: 1920
num_train_steps: 9436
seed: 42
num_workers: 8
log_interval: 100
save_interval: 674
keep_period: 5000
overwrite: false
resume: true
wandb_enabled: false
fsdp_devices: 8
ema_decay: 0.99

pytorch_training_precision: bfloat16
pytorch_weight_path: /workspace/openpi/models/pi05_fixed

model:
  action_horizon: 50

lr_schedule:
  warmup_steps: 250
  peak_lr: 1.0e-4
  decay_lr: 1.0e-5
  decay_steps: 9436

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

data:
  repo_id: /workspace/openpi/datasets/00073_20260818_RM_01_yj_21_fps10
  assets:
    assets_dir: /workspace/openpi/datasets/00073_20260818_RM_01_yj_21_fps10
    asset_id: "."
  default_prompt: "Using both hands, pick up the courier items from the green conveyor belt. Place the white courier bags into the left box and the brown courier boxes into the right box."
  prompt_from_task: true
  prompt_from_subtask: false
  adapt_to_pi: false
  delta_action_dims: [7, 7, -1, -1]
