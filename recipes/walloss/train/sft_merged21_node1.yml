# WALL-OSS-0.5 SFT on merged_pick_place_dual_arm_21（gpu-node1 单卡）
# 2026-09-16 resume：从 3_35000 续训；num_workers=1 + prefetch_factor=1
# 避免 8 worker 常驻解码把主机内存/swap 吃光（π0.5 同源泄漏）
#
# 启动: bash /data/wall-oss/code/train/start_merged21.sh
model_type: qwen2_5

task:
  dof_config:
    action: 16
    action_padding: 10
  ar_dof_config:
    action: 16
    action_padding: 10
  agent_pos_config:
    observation.state: 16
    action_padding: 10
  action_horizon: 32
  action_horizon_flow: 32
  use_state_string_representation: false

model:
  backbone: qwen2_5
  config_path: /data/wall-oss/pretrained/wall-oss-0.5/config.json
  processor_path: /data/wall-oss/pretrained/Qwen2.5-VL-3B-Instruct
  pretrained_path: /data/wall-oss/pretrained/wall-oss-0.5
  attn_deterministic: true
  use_ema: false
  flow_loss_weight: 1.0
  ar_loss_weight: 0.01
  enable_customized_robot_config: false

hyperparams:
  num_epoch: 10
  batch_size_per_gpu: 16
  gradient_accumulation_steps: 1
  seed: 10233
  optimizer:
    optimizer_type: adamw
    learning_rate: 5.0e-05
    max_grad_norm: 1.0
    enable_grad_clip: true
    betas: [0.9, 0.95]
    weight_decay: 1.0e-8
    eps: 1.0e-8
  scheduler:
    scheduler_type: cosine
    num_warmup_steps: 200
    num_training_steps: 151500
    min_lr: 1.0e-6

distributed:
  use_fsdp: true
  use_mixed_precision: true
  bf16: true
  use_gradient_checkpointing: true

data:
  dataset_type: lerobot
  lerobot_config:
    repo_id: /home/cqcigai/datasets/merged_pick_place_dual_arm_21
    root: null
  key_mappings:
    camera:
      observation.images.front: face_view
      observation.images.left: left_wrist_view
      observation.images.right: right_wrist_view
    state: observation.state
    action: action
  norm_stats_path: /data/wall-oss/outputs/norm_stats_merged21_wallx.json
  train_test_split: 0.95
  num_workers: 1
  prefetch_factor: 1
  max_length: 1024
  resolution:
    face_view: 256
    left_wrist_view: 256
    right_wrist_view: 256

logging:
  log_name: walloss05_tongbot_merged21_node1
  log_project: walloss
  log_entity: null
  use_wandb: false
  log_interval: 10
  save_interval: 5000
  val_interval: 2000
  epoch_save_interval: 1

checkpoint:
  save_path: /data/wall-oss/outputs/walloss05_tongbot_merged21_node1
  resume_from: /data/wall-oss/outputs/walloss05_tongbot_merged21_node1/3_35000

debug:
  profile: false
  nvtx: false
