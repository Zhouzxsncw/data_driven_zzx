  - id: task117_floss
    label: 117 牙线盒放入抽屉
    task_prompt: Put the floss box into the blue-and-white drawer.
  - id: task117_original
    label: 117 ORIGINAL 完整训练指令（DEFAULT）
    task_prompt: 'On the white worktable, perform the following manipulation tasks:
      grasp the black pen and insert it into the black mesh pen holder; collect the
      trash and drop it into the trash can lined with a black garbage bag; pick up
      the floss box and place it inside the drawer of the blue-and-white storage box.'
