# 江算-4 · 整机只训一个模型。00086 药盒抽屉。
# 4 卡独占 96/卡 = global 384，超参与 ppu8 相同。
# 128887 帧 → 335 step/ep × 100 = 33500 step。
config_name: pi05_aloha
framework: pytorch

exp_name: 00086_PI05_ppu4_bs384_lr1.5e-4_ah50_20260920
project_name: openpi
checkpoint_base_dir: /nvme2n1/outputs
assets_base_dir: ./assets

batch_size: 384
num_epochs: 10
seed: 42
num_workers: 8
log_interval: 100
save_every_epochs: 10
keep_period: 5000
overwrite: false
resume: false
wandb_enabled: false
fsdp_devices: 4
ema_decay: 0.99

pytorch_training_precision: bfloat16
pytorch_weight_path: /home/ubuntu/lerobot/CQTongBot-train-ppu/base_model/pi05_fixed

model:
  action_horizon: 50

lr_schedule:
  warmup_steps: 250
  peak_lr: 1.0e-4
  decay_lr: 1.0e-5
  decay_steps: 33500

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

data:
  repo_id: /nvme2n1/dataset/00086_20260827_RM_01_YJ_ZL_21
  assets:
    assets_dir: /nvme2n1/dataset/00086_20260827_RM_01_YJ_ZL_21
    asset_id: "."
  default_prompt: "Using both hands, pull open the drawer with the blue handle using your left hand, take out the white medicine box with your right hand, place it into the green drawer, and finally close the drawer."
  prompt_from_task: true
  prompt_from_subtask: false
  adapt_to_pi: false
  delta_action_dims: [7, 7, -1, -1]
