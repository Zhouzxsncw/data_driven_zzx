# WALL-OSS-0.5 SFT template：TongBot RM75 相对 EE（20D + pad 6 = 26）
# 由 scripts/ee_sft_pipeline.sh 填路径，不要手改这份去开训。
# 磁盘上 *.ee 是绝对 EE；_relative 键让 loader 按当前帧做增量。

model_type: qwen2_5

task:
  dof_config:
    follow_left_ee_cartesian_pos_relative: 3
    follow_left_ee_rotation_6D_relative: 6
    follow_left_gripper: 1
    follow_right_ee_cartesian_pos_relative: 3
    follow_right_ee_rotation_6D_relative: 6
    follow_right_gripper: 1
    action_padding: 6
  ar_dof_config:
    follow_left_ee_cartesian_pos_relative: 3
    follow_left_ee_rotation_6D_relative: 6
    follow_left_gripper: 1
    follow_right_ee_cartesian_pos_relative: 3
    follow_right_ee_rotation_6D_relative: 6
    follow_right_gripper: 1
    action_padding: 6
  agent_pos_config:
    follow_left_ee_cartesian_pos: 3
    follow_left_ee_rotation_6D: 6
    follow_left_gripper: 1
    follow_right_ee_cartesian_pos: 3
    follow_right_ee_rotation_6D: 6
    follow_right_gripper: 1
    action_padding: 6
  action_horizon: 32
  action_horizon_flow: 32
  use_state_string_representation: false

model:
  backbone: qwen2_5
  config_path: {{PRETRAINED}}/config.json
  processor_path: {{PROCESSOR}}
  pretrained_path: {{PRETRAINED}}
  attn_deterministic: true
  use_ema: false
  flow_loss_weight: 1.0
  ar_loss_weight: 0.01
  # 连续 flow 读 action.ee；离散 AR 用同一段归一化 chunk 过 FAST。
  action_tokenizer_type: {{ACTION_TOKENIZER_TYPE}}
  action_tokenizer_path: {{ACTION_TOKENIZER_PATH}}

hyperparams:
  num_epoch: {{NUM_EPOCH}}
  batch_size_per_gpu: {{BS}}
  gradient_accumulation_steps: {{ACCUM}}
  seed: 10233
  optimizer:
    optimizer_type: adamw
    learning_rate: 5.0e-05
    max_grad_norm: 1.0
    enable_grad_clip: true
    betas: [0.9, 0.95]
    weight_decay: 1.0e-8
    eps: 1.0e-8
  scheduler:
    scheduler_type: cosine
    num_warmup_steps: {{WARMUP}}
    num_training_steps: {{MAX_STEPS}}
    min_lr: 1.0e-6

distributed:
  # 单卡共享 GPU 用 DDP+bf16；多卡 FSDP。pipeline 按 --nproc 填。
  use_fsdp: {{USE_FSDP}}
  use_mixed_precision: true
  bf16: true
  fsdp_cpu_offload: {{FSDP_CPU_OFFLOAD}}
  use_gradient_checkpointing: true

data:
  dataset_type: lerobot
  lerobot_config:
    repo_id: {{EE_DST}}
    root: null
  key_mappings:
    camera:
      observation.images.front: face_view
      observation.images.left: left_wrist_view
      observation.images.right: right_wrist_view
    state: observation.state.ee
    action: action.ee
  norm_stats_path: {{NORM_PATH}}
  train_test_split: 0.95
  use_fast_tokenizer: {{USE_FAST_TOKENIZER}}
  action_tokenizer_path: {{ACTION_TOKENIZER_PATH}}
  action_horizon_ar: 32
  num_workers: {{NUM_WORKERS}}
  max_length: 1024
  resolution:
    face_view: {{RES}}
    left_wrist_view: {{RES}}
    right_wrist_view: {{RES}}

logging:
  log_name: {{LOG_NAME}}
  log_project: walloss
  log_entity: ""
  use_wandb: false
  log_interval: 10
  save_interval: {{SAVE_INTERVAL}}
  val_interval: {{VAL_INTERVAL}}
  epoch_save_interval: 1

checkpoint:
  save_path: {{SAVE_PATH}}
  resume_from: {{RESUME}}
