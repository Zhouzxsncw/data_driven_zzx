# 天翼云 cty-18 · 8×ZW-M890P π0.5 · 00073 原生 15Hz · 动作槽 [7, -1, 7, -1]
# 落盘仍是 [左7 | 右7 | 左爪 | 右爪]。interleave_grippers 先重排成
# [左7 | 左爪 | 右7 | 右爪]，关节做增量、夹爪保持绝对。
# 归一化方法仍是 quantile。stats 写在 assets/00073_rgb_d7171，不覆盖数据集根目录。
# bs384 / 48 per card / lr 1.5e-4 / warmup 1334 / cosine / bf16 / fixbase。
config_name: pi05_aloha
framework: pytorch

exp_name: 00073_PI05_cty18_bs384_ah50_d7171
project_name: openpi
checkpoint_base_dir: /workspace/outputs
assets_base_dir: ./assets

batch_size: 384
num_epochs: 10
seed: 42
num_workers: 8
log_interval: 100
save_every_epochs: 5
keep_period: 5000
overwrite: false
resume: false
wandb_enabled: false
fsdp_devices: 8
ema_decay: 0.99

pytorch_training_precision: bfloat16
pytorch_weight_path: /workspace/openpi/models/pi05_fixed

model:
  action_horizon: 50

lr_schedule:
  warmup_steps: 250
  peak_lr: 1.0e-4
  decay_lr: 1.0e-5
  decay_steps: 50600

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

data:
  repo_id: /workspace/openpi/datasets/00073_20260818_RM_01_yj_21
  assets:
    assets_dir: /workspace/openpi/assets/00073_rgb_d7171
    asset_id: "."
  default_prompt: "Using both hands, pick up the courier items from the green conveyor belt. Place the white courier bags into the left box and the brown courier boxes into the right box."
  prompt_from_task: true
  prompt_from_subtask: false
  adapt_to_pi: false
  delta_action_dims: [7, -1, 7, -1]
  interleave_grippers: true
