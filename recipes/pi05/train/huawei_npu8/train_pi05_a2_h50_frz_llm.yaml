# π0.5 华为冻结。A2 卡 0–7。块长 50，从基座重开。没有第二阶段解冻。
# trainable_modules: vision_action = 训视觉和动作专家，冻住语言模型。
# 动作对齐跟 cty-19 的 0.2 秒：数据原生 15 Hz，不抽帧，观测留在 t，动作块从 t+3 开始。
config_name: pi05_aloha
framework: pytorch

exp_name: mix_108_36_91_73_PI05_a2_h50_frz_llm
project_name: openpi
checkpoint_base_dir: /home/pi05/ckpt_on_software
assets_base_dir: ./assets

batch_size: 256
num_epochs: 10
seed: 42
num_workers: 8
log_interval: 50
save_every_epochs: 1
keep_period: 5000
overwrite: false
resume: false
wandb_enabled: false
fsdp_devices: 8
ema_decay: 0.99
trainable_modules: vision_action

pytorch_training_precision: bfloat16
pytorch_weight_path: /home/pi05/models

model:
  action_horizon: 50

lr_schedule:
  warmup_steps: 250
  peak_lr: 1.0e-4
  decay_lr: 1.0e-5
  decay_steps: 300000

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

data:
  repo_id: /home/pi05/mix_108_36_91_73
  # 0.2s × 15 Hz → 3 帧。和 cty-19 d0p2 同一条。设 0 才是观测和动作同一时刻。
  action_delay_sec: 0.2
  assets:
    assets_dir: /home/pi05/mix_108_36_91_73
    asset_id: "."
  default_prompt: "With both hands, pick up the yellow banana and the yellow lemon and put them into the black box; then take the green vegetables and place them into the blue box."
  prompt_from_task: true
  prompt_from_subtask: false
  adapt_to_pi: false
  use_delta_joint_actions: true
  delta_action_dims: [7, -1, 7, -1]
  interleave_grippers: true
  val_ratio: 0.1
  val_seed: 42
  vector_norm: quantile
  image_keys:
    - observation.images.front
    - observation.images.left
    - observation.images.right
  drop_cameras: []
