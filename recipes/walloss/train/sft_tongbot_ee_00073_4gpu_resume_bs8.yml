# WALL-OSS-0.5 SFT 00073 EE，从 epoch-0 档 resume。
# 全局 batch 保持 64（4×8×2），不改 LR/cosine，只加大 microbatch 把 4 卡显存拉起来。
# 原配方：batch_size_per_gpu=2, accum=8；训练期 ~33GB。8/卡估 ~70GB。
# resume：/workspace/outputs/walloss05_tongbot_ee_00073/0 （step 2716 → epoch 1）
model_type: qwen2_5

task:
  dof_config:
    follow_left_ee_cartesian_pos_relative: 3
    follow_left_ee_rotation_6D_relative: 6
    follow_left_gripper: 1
    follow_right_ee_cartesian_pos_relative: 3
    follow_right_ee_rotation_6D_relative: 6
    follow_right_gripper: 1
    action_padding: 6
  ar_dof_config:
    follow_left_ee_cartesian_pos_relative: 3
    follow_left_ee_rotation_6D_relative: 6
    follow_left_gripper: 1
    follow_right_ee_cartesian_pos_relative: 3
    follow_right_ee_rotation_6D_relative: 6
    follow_right_gripper: 1
    action_padding: 6
  agent_pos_config:
    follow_left_ee_cartesian_pos: 3
    follow_left_ee_rotation_6D: 6
    follow_left_gripper: 1
    follow_right_ee_cartesian_pos: 3
    follow_right_ee_rotation_6D: 6
    follow_right_gripper: 1
    action_padding: 6
  action_horizon: 32
  action_horizon_flow: 32
  use_state_string_representation: false

model:
  backbone: qwen2_5
  config_path: /workspace/pretrained/wall-oss-0.5/config.json
  processor_path: /workspace/pretrained/Qwen2.5-VL-3B-Instruct
  pretrained_path: /workspace/pretrained/wall-oss-0.5
  attn_deterministic: true
  use_ema: false
  flow_loss_weight: 1.0
  ar_loss_weight: 0.01
  enable_customized_robot_config: false

hyperparams:
  num_epoch: 10
  batch_size_per_gpu: 8
  gradient_accumulation_steps: 2
  seed: 10233
  optimizer:
    optimizer_type: adamw
    learning_rate: 5.0e-05
    max_grad_norm: 1.0
    enable_grad_clip: true
    betas: [0.9, 0.95]
    weight_decay: 1.0e-8
    eps: 1.0e-8
  scheduler:
    scheduler_type: cosine
    num_warmup_steps: 200
    num_training_steps: 30000
    min_lr: 1.0e-6

distributed:
  use_fsdp: true
  use_mixed_precision: true
  bf16: true
  use_gradient_checkpointing: false

data:
  dataset_type: lerobot
  lerobot_config:
    repo_id: /workspace/datasets/00073_rm75_ee
    root: null
  key_mappings:
    camera:
      observation.images.front: face_view
      observation.images.left: left_wrist_view
      observation.images.right: right_wrist_view
    state: observation.state.ee
    action: action.ee
  norm_stats_path: /workspace/outputs/norm_stats_00073_ee_wallx.json
  train_test_split: 0.95
  num_workers: 4
  max_length: 1024
  resolution:
    face_view: 256
    left_wrist_view: 256
    right_wrist_view: 256

logging:
  log_name: walloss05_tongbot_ee_00073
  log_project: walloss
  log_entity: null
  use_wandb: false
  log_interval: 10
  save_interval: 500
  val_interval: 2000
  epoch_save_interval: 1

checkpoint:
  save_path: /workspace/outputs/walloss05_tongbot_ee_00073
  resume_from: /workspace/outputs/walloss05_tongbot_ee_00073/0

debug:
  profile: false
  nvtx: false
