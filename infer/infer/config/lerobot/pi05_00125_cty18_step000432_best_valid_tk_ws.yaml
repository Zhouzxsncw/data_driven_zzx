# 00125 单任务（放笔→笔筒，再合书→摆正）模型
# ckpt: rm03_00125_pi05_cty18_8gpu_step000432_best_valid（step 432 / 10800 = 4.0%，bs=384，trainable=action 冻结视觉+LLM）
#   数据: /workspace/openpi/datasets/00125_20261104_rm03_yj_21（116 eps，与本机 00125_20261104_rm03_yj_21 完全对应）
#   prompt_from_task=True / default_prompt='null'（字符串形式的空值，非可用提示词）
#   → 推理 prompt = 00125 数据集 meta/tasks.jsonl 原文，已逐字校验
#   delta=[7,-1,7,-1] / interleave=true / horizon 10 / 3cam front-left-right / 15fps / action_delay 0.2s
#   ⚠ 场景是"笔 + 笔筒 + 书"，不是垃圾/牙线盒/抽屉那一套；模型只有 4% 训练进度
#   action_horizon=10 / delta_action_dims=[7,-1,7,-1] / interleave_grippers=true
#   target_fps=15 / action_delay_sec=0.2 / state=actions=16D [L7|Lg|R7|Rg]
# 安全档: max_tests=1, max_duration_sec=30, replan_steps=5
