# Camera mapping matched to the target workstation's RM75 configuration.
dataset:
  repo_id: auto
  name_prefix: pick_place_dual_arm
  root: /home/cigai22/data_Driven_zzx/output/collections
  task: Use both arms pick up the  and place task.
  fps: 15
  robot_type: tong_dual_arm
  table_height: 85
network:
  high_host: 192.168.1.12
  low_host: 192.168.1.13
  ports:
    robot_action: 18131
    gripper_state: 30016
    exo_state: 18140
    exo_command: 30026
modalities:
  state:
    left_arm:
      enabled: true
      required: true
      fallback: drop_frame
    right_arm:
      enabled: true
      required: true
      fallback: drop_frame
    left_gripper:
      enabled: true
      required: true
      fallback: drop_frame
    right_gripper:
      enabled: true
      required: true
      fallback: drop_frame
    right_hand:
      enabled: false
      required: false
      fallback: hold_last
  action:
    left_arm:
      enabled: true
      required: true
      fallback: drop_frame
    right_arm:
      enabled: true
      required: true
      fallback: drop_frame
    left_gripper:
      enabled: true
      required: true
      fallback: drop_frame
    right_gripper:
      enabled: true
      required: true
      fallback: drop_frame
    right_hand:
      enabled: false
      required: false
      fallback: hold_last
  gripper_source: 0
  gripper_value_filter:
    enabled: true
    open_value: 1.0
    open_deadband: 0.08
    close_threshold: 0.85
    stable_samples: 2
    output_mode: binary
    ema_alpha: 1.0
cameras:
  enabled: true
  use_host_timestamp: true
  get_timeout_sec: 10.0
  enable_display: true
  depth:
    enabled: true
    dir_name: depth
    format: png
    align_to_color: true
    feature_prefix: observation.depth
    devices:
    - observation.images.cam_left
    - observation.images.cam_mid
    - observation.images.cam_right
  devices:
  - key: observation.images.cam_left
    serial: f1480854
    width: 960
    height: 540
    fps: 30
    save_depth: true
    depth_width: 320
    depth_height: 240
    depth_fps: 30
  - key: observation.images.cam_mid
    serial: f1420947
    width: 960
    height: 540
    fps: 30
    save_depth: true
    depth_width: 320
    depth_height: 240
    depth_fps: 30
  - key: observation.images.cam_right
    serial: f1380315
    width: 960
    height: 540
    fps: 30
    save_depth: true
    depth_width: 320
    depth_height: 240
    depth_fps: 30
sync:
  max_time_diff: null
  sync_delay: 0.05
  buffer_size: 200
  prefill_sec: 2.0
  min_anchor_buffer: 5
  cleanup_interval_frames: 15
  cleanup_keep_sec: 1.0
  clock_offset:
    robot_action: 0.0
    camera: 0.0
    gripper_state: 0.0
    exo_state: 0.0
    robot_state: 0.0
episode:
  image_writer_processes: 0
  image_writer_threads: 12
  video_codec: h264
  prompt_save: true
  prompt_continue: true
  batch_mode: true
  episodes_per_batch: 20
  spill_jpeg_quality: 95
  spill_writer_threads: 4
realtime_gripper_plot:
  enabled: true
  max_points: 3000
  update_interval_sec: 0.0
robot_arm:
  enabled: true
  sdk_path: /home/cigai22/anaconda3/envs/openpi-pi05-infer/lib/python3.11/site-packages
  robot_r_host: 192.168.1.17
  robot_l_host: 192.168.1.18
  port_r: 8080
  port_l: 8080
  control_hz: 30.0
  state_hz: 30.0
  gripper_host: 192.168.1.13
  gripper_port: 30015
  init_grippers_on_start: true
  gripper_initial_position:
  - 0.7
  - 0.7
  gripper_filter:
    enabled: true
    open_value: 1.0
    open_deadband: 0.06
    change_threshold: 0.08
    stable_samples: 2
    ema_alpha: 1.0
logging:
  level: INFO
  log_sync_every_n_frames: 30
  log_file: null
qa:
  enabled: false
  threshold: 0.65
  warn_if_below_threshold: true
  save_report: true
  report_subdir: qa_reports
  report_path: null
consistency:
  enabled: true
  warn_median_diff_deg: 3.0
  max_median_diff_deg: 15.0
  min_frames: 30
  on_violation: reject
  live_check_sec: 3.0
