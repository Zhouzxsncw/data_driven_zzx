# ============================================================================
# pi05 真机推理 · 唯一常驻配置文件（以后所有模型都在这一份上迭代，不再新建）
# 用法： bash recipes/pi05/run_current_tk.sh check|server|client
# ============================================================================
#
# 【换模型时只改这 5 处 + 2 个可选】
#   1. policy.ckpt_dir            —— 指向 <ckpt>/pretrained_model（必须存在 3 个文件）
#   2. experiment_name            —— 建议与 ckpt 同名，便于区分日志/结果目录
#   3. recording.inference_dir    —— 建议 …/models/<同 step>/inference
#   4. policy.task_prompt         —— 必须与训练集 meta/tasks.jsonl 逐字一致
#   5. policy.dataset_root        —— 必须指向本机存在 meta/info.json 的同工位数据集
#                                   （init_pose_source=dataset_median 的初始位来源；
#                                     换场景却忘改它 → 开局内扣）
#   可选 A. session.max_duration_sec —— 按任务时长给（单任务 40~60，多任务/慢任务 100）
#   可选 B. task_prompt_presets    —— 现场临时切句用，不影响默认 prompt
#
# 【只有训练超参变了才动，且必须与 train_config.json 一致】
#   policy.openpi_action_horizon / n_action_steps_override / openpi_delta_action_dims /
#   openpi_interleave_grippers / openpi_vector_norm / session.fps
#
# 【当前指向】（服务端与客户端共用本文件，两端模型只看 policy.ckpt_dir 这一处）
#   ckpt: mix_108_36_91_73_112_PI05_cty18_bs768_ah50_fps15_d0p2_action_cty18_step007379（3 号盘 T9_3，混合 00108/00036/00091/00073/00112，3 路 RGB）
#   训练口径: horizon 50 / 15Hz（d0p2 action）/ 标准初始位（init_pose_source: standard，不使用 dataset_root）
#   delta=[7,-1,7,-1] / interleave=true / adapt_to_pi=false / 3cam front-left-right
#   时长: 现场按 100s 上限（模型无自停行为，靠时间窗收段）
