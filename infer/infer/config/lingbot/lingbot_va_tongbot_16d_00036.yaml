# =============================================================================
# LingBot-VA (Wan2.2 视频-动作世界模型) × 00036 原生 16D
# 训练: H100-103, 00036_va_h100_16ch checkpoint_step_2500, cobot_16d_tshape
# 权重: /media/cigai22/T9_2/checkpoint_step_2500/transformer  （服务端 YAML 加载）
#   1) 启动 LingBot-VA 推理服务 (conda activate lingbotva, 端口 1234):
#        cd /home/cigai22/lingbot-va-infer
#        python run_lingbotva_infer.py --config config_00036.yaml --mode server
#   2) 客户端 (conda activate openpi-pi05-infer，等 1234 起来后再开):
#        cd /home/cigai22/infer
#        python3 infer/cli/run_batch_infer.py --config infer/config/lingbot/lingbot_va_tongbot_16d_00036.yaml
# =============================================================================
# 动作维序 (H100 00036_va_h100_16ch):
#   - used_action_channel_ids [0-15] = left7 + right7 + gripper2
#   - 真机 TongBot 16D: [left7, right7, left_gripper, right_gripper]
#   - adapter 直接下发 16D，含夹爪
# =============================================================================

experiment_name: lingbot_va_tongbot_16d_00036

engine: native

policy:
  type: lingbot_va
  lingbot_backend: websocket
  lingbot_host: "10.151.43.183"
  lingbot_port: 1234
  lingbot_connect_timeout_sec: 300.0
  # websocket 模式下权重在服务端 config_00036.yaml 加载；此处仅作记录
  ckpt_dir: /media/cigai22/T9_2/checkpoint_step_2500
  tasks_per_group: 12
  task_prompt: "With both hands, pick up the yellow banana and the yellow lemon and put them into the black box; then take the green vegetables and place them into the blue box."
  # 第一包丢掉条件帧后剩 16 步；后续整包 32 步。25 会截掉后半预测。
  n_action_steps_override: 32
  use_action_chunk: true
  # LingBot-VA 00036 相机 key (与训练一致)
  camera_keys: [observation.images.front, observation.images.left, observation.images.right]
  rtc_enabled: false
  action_scale: 1.0
  action_clip_abs: null

network:
  high_host: "192.168.1.12"
  low_host: "192.168.1.13"
  state_port: 18132
  control_port: 30005
  gripper_port: 30015
  gripper_state_port: 30016
  camera_port: 18888

camera_sender:
  enabled: true
  transport: local
  target_host: null
  target_port: null
  jpeg_quality: 95
  use_host_timestamp: true
  get_timeout_sec: 3.0
  reconnect_delay_sec: 0.5
  devices:
    # LingBot-VA 00036 训练用 front/left/right 三相机
    # 物理相机与 VLA 配置相同, 仅 key 映射不同:
    #   front = 中间相机 (cam_mid, serial f1420947)
    #   left  = 左侧相机 (cam_left, serial f1480854)
    #   right = 右侧相机 (cam_right, serial f1380315)
    - key: observation.images.front
      serial: "f1420947"
      width: 640
      height: 480
      fps: 30
    - key: observation.images.left
      serial: "f1480854"
      width: 640
      height: 480
      fps: 30
    - key: observation.images.right
      serial: "f1380315"
      width: 640
      height: 480
      fps: 30

direct_robot:
  enabled: true
  sdk_path: ~/RM_API
  gripper_mode: udp
  gripper_state_source: udp
  gripper_initial_position: [1.0, 1.0]
  reset_to_init_on_group_start: true
  init_pose_source: standard
  random_task_init_pose: false
  random_task_init_radius_m: 0.10
  random_task_init_max_attempts: 32
  reset_to_init_on_task_start: true
  mirror_right_init_from_left: false
  standard_init_joint_degrees:
    - 0.0
    - 2.5
    - 0.0
    # left
    - -103.0
    - -73.67
    - 89.0
    - -8.31
    - -22.0
    - -75.5
    - 76.4
    # right
    - 127.83
    - 71.07
    - -69.22
    - 36.5
    - 17.23
    - 79.71
    - 129.44
  reset_move_speed: 10
  reset_settle_sec: 1.5
  robot_r_host: "192.168.1.17"
  robot_l_host: "192.168.1.18"
  port_r: 8080
  port_l: 8080
  enable_joint: [false, false, false]
  left_gripper_kwargs:
    dxl_name: XM430
    Device_name: /dev/ttyUSB0
    dxl_id: 1
    baudrate: 4000000
    min_position: 1395
    max_position: 2043
  right_gripper_kwargs:
    dxl_name: XM430
    Device_name: /dev/ttyUSB1
    dxl_id: 2
    baudrate: 4000000
    min_position: 1395
    max_position: 2043
  state_poll_hz: 100.0

sync:
  max_time_diff: null
  sync_delay: 0.05
  buffer_size: 1000
  prefill_sec: 2.0
  min_anchor_buffer: 5
  clock_offset:
    robot_state: 0.0
    camera: 0.0

recording:
  enabled: true
  save_videos: true
  save_trajectory: true
  save_third_cam: true
  save_fourth_cam: true
  inference_dir: null
  generate_debug_plot: true
  debug_plot_max_dims: 16
  debug_plot_dpi: 160
  golden_capture: false
  golden_capture_dir: null
  golden_capture_mode: policy

session:
  fps: 15
  max_tests: null
  max_duration_sec: null
  prompt_continue: true
  auto_finalize: true
  task_mode: continuous_tasks
  pedal_task_control: true
  visualize_cam_left: true
  visualize_cam_mid: true
  visualize_cam_right: true
  cam_left_window_name: cam_left
  cam_mid_window_name: cam_mid
  cam_right_window_name: cam_right

pedal:
  task_toggle: ctrl+.
  confirm: y
  cancel: n
  discard: delete
  exo_takeover: ctrl+1
  exo_safety_infer: ctrl+2

exo_safety:
  enabled: true
  exo_state_port: 18140
  exo_command_port: 30026
  collect_config: ../../../data_collect/config/dual_arm_gripper_2cam.yaml
  record_start_delay_sec: 2.0
  collect_cam_mid_window_name: exo_collect_cam_mid
  align_enabled: true
  align_mode: auto
  align_max_joint_err_deg: 12.0
  align_rms_joint_err_deg: 8.0
  align_log_every_sec: 1.0
  align_drive_max_step_deg: 2.0
  align_target_send_hz: 50.0

logging:
  level: INFO
  human_log_level: INFO
  file_log_level: INFO
  log_sync_every_n_frames: 30
  # 每步动作写入 run.log，排查飞臂/夹爪时打开
  log_action_steps_detail: true
  machine_flow_enabled: true
  alerts_enabled: true
  device_health_enabled: true
  device_health_live_status_ui: true
  device_health_pause_on_anomaly: true
  device_health_pause_require_confirm: true
  # 客户端进程级日志（跨 test）。结构化 jsonl 另见:
  #   /home/cigai22/infer/logs/lingbot_va_client.jsonl
  # 服务端:
  #   /home/cigai22/lingbot-va-infer/server_00036.log
  #   /home/cigai22/lingbot-va-infer/va_infer_debug.jsonl
  log_file: /home/cigai22/infer/logs/lingbot_va_session.log

evaluation:
  enabled: true
  auto_after_each_test: true
  save_report: true
  report_filename: evaluation_report.json
  metrics: [automatic]
  labels_file: null
  sync_warn_rate_threshold: 0.30
  eval_log_enabled: true
  eval_log_filename: eval_log.jsonl
  eval_log_save_images: false
  eval_log_image_dir: eval_images
  eval_log_image_format: jpg
  eval_log_save_videos: false
  eval_log_video_dir: eval_videos
  eval_log_generate_plots: true
  eval_log_plot_dir: eval_plots
  eval_log_plot_dpi: 150

ablation:
  enabled: false

batch_infer:
  action_step_parts: 5
  phase: action-step
  ood_tasks_per_group: 1
  output_dir: null
  best_action_step: null
  skip_existing: false
  ood_presets: ../ood_language_presets_dual_arm.yaml
  feedback_score_sheet: false

  vla_auto_eval:
    enabled: false
    output_dirname: eval_table
    result_table_name: eval_result.et
    summary_name: summary.md

  remote_sync:
    enabled: false
    host: "10.151.43.132"
    port: 22
    username: "xk"
    remote_dir: "/home/xk/CQTongBot/research/ablation/runs/real"
    private_key_path: ~/.ssh/id_ed25519
