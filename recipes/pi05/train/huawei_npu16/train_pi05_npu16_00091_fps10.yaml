# A3 一路 16 卡。npu-smi HBM 65536 MiB。
# 每卡 24，global 384，lr 在 1e-4 上乘 √(24/16)。不开 32/卡。
# norm_stats 是 fps10 降采样之后重算的。
#   python3 scripts/compute_norm_stats_parquet.py --dataset <fps10> --batch 384
config_name: pi05_aloha
framework: pytorch

exp_name: 00091_PI05_npu16_bs384_lr1.225e-4_ah50_fps10_fixbase
project_name: openpi
checkpoint_base_dir: ./checkpoints
assets_base_dir: ./assets

batch_size: 384          # 16 NPU × 24
num_epochs: 10
seed: 42
num_workers: 16
log_interval: 50

save_every_epochs: null
save_interval: 2000
save_full_every_epochs: null
keep_period: 5000
overwrite: false
resume: false
wandb_enabled: false
fsdp_devices: 16
ema_decay: 0.99

pytorch_training_precision: bfloat16
pytorch_weight_path: /home/pi05/models

model:
  action_horizon: 50

lr_schedule:
  warmup_steps: 250
  peak_lr: 1.0e-4
  decay_lr: 1.0e-5
  decay_steps: 36100      # 138903//384 = 361 步/epoch × 100

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

data:
  repo_id: /home/pi05/00091_20260903_RM_01_yj_21_fps10
  assets:
    assets_dir: /home/pi05/00091_20260903_RM_01_yj_21_fps10
    asset_id: "."
  default_prompt: "Using both hands, pull open the drawer with the blue handle using your left hand, take out the white medicine box with your right hand, place it into the green drawer, and finally close the drawer."
  prompt_from_task: true
  prompt_from_subtask: false
  adapt_to_pi: false
  delta_action_dims: [7, 7, -1, -1]
