# TongBot 00036 香蕉柠檬 — gpu-node1 单卡 RTX PRO 6000 96GB
# 数据集: LeRobot v2.1, 151 episodes, 50440 frames, 15fps, 16D, 3 cams
# 相机: front/left/right → Motus three_cam T 拼图（之后训练；js4 旧 ckpt 仍是 front 单目）
# 启动: NPROC=1 CONFIG_FILE=configs/tongbot_00036.yaml bash recipes/motus/launch_train.sh
common:
  action_dim: 16         # TongBot 16D: left7 + right7 + gripper2
  state_dim: 16

  num_video_frames: 8
  video_height: 384
  video_width: 320

  # 15fps 数据：每 3 帧取 1 帧 → 5fps; video:action = 2:1
  global_downsample_rate: 3
  video_action_freq_ratio: 2

dataset:
  type: "lerobot"
  max_episodes: null
  image_aug: false
  task_mode: "multi"
  task_name: null

  params:
    repo_id: "00036_20260804_RM_01_yj_v21"
    root: "/data/motus/dataset/00036_20260804_RM_01_yj_v21"

    embodiment_type: "tong_dual_arm"
    enable_t5_fallback: true
    t5_wan_path: "/data/motus/Motus/pretrained_models"
    t5_folder_name: "t5_embedding"
    t5_text_len: 512

model:
  wan:
    config_path: "/data/motus/Motus/pretrained_models/Motus_Wan2_2_5B_pretrain"
    checkpoint_path: "/data/motus/Motus/pretrained_models/Motus_Wan2_2_5B_pretrain"
    vae_path: "/data/motus/Motus/pretrained_models/Wan2.2-TI2V-5B/Wan2.2_VAE.pth"
    precision: "bfloat16"
  vlm:
    checkpoint_path: "/data/motus/Motus/pretrained_models/Qwen3-VL-2B-Instruct"
    config_path: "/data/motus/Motus/pretrained_models/Qwen3-VL-2B-Instruct"
    precision: "bfloat16"
    frozen: true
  action_expert:
    hidden_size: 1024
    ffn_dim_multiplier: 4
    norm_eps: 1e-5
  und_expert:
    hidden_size: 512
    ffn_dim_multiplier: 4
    norm_eps: 1e-5
    vlm:
      input_dim: 2048
      projector_type: "mlp3x_silu"
  time_distribution:
    timestep_sample_method: "logit_normal"
    sigmoid_scale: 1.0
    min_t: 0.0
    max_t: 1.0
  inference:
    num_inference_timesteps: 10
  loss_weights:
    video_loss_weight: 1.0
    action_loss_weight: 1.0
  ema:
    enabled: false
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999

training:
  # 单卡 96GB：保守 batch_size=1，配合 grad_accum=8 → effective batch=8
  batch_size: 1
  max_steps: 20000
  learning_rate: 5.0e-5
  weight_decay: 0.01

  scheduler_type: "linear"
  warmup_steps: 200
  cycle_length: 5000000
  f_max: 0.99
  f_min: 0.4

  grad_clip_norm: 0.5
  use_amp: true
  find_unused_parameters: false

system:
  checkpoint_dir: "/data/motus/outputs/00036/checkpoints"
  log_level: "INFO"

  log_interval: 1
  save_interval: 1000
  val_interval: 500

  # 单卡少开 worker，省内存
  num_workers: 4
  pin_memory: true

logging:
  report_to: "tensorboard"
  wandb_project: "motus"
  tensorboard_log_dir: "/data/motus/outputs/00036/tensorboard"
  run_name: "tongbot_00036"

resume:
  checkpoint_path: null

finetune:
  checkpoint_path: /data/motus/Motus/pretrained_models/Motus
