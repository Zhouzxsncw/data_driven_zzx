defaults:
  - hybrid_engines/fsdp@actor.fsdp_config
  - model/dreamzero_5b@actor.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "tong00073_sft_dreamzero"
    logger_backends: ["tensorboard"]

  max_epochs: -1
  max_steps: 50000
  val_check_interval: -1
  save_interval: 3000
  log_interval: 100
  resume_dir: null

data:
  train_data_paths: /data1/dataset/00073_20260818_RM_01_yj_21
  lazy_load: True
  num_workers: 8
  prefetch_factor: 8
  video_tolerance_s: 0.1
  parquet_cache_size: 512
  sampling_mode: multi_anchor
  video_backend: pyav

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4
  global_batch_size: 32
  seed: 42

  model:
    model_type: "dreamzero"
    precision: fp32
    model_path: null
    tokenizer_path: /data1/dreamzero-pretrained/umt5-xxl
    diffusion_model_pretrained_path: /data1/dreamzero-pretrained/Wan2.2-TI2V-5B
    image_encoder_pretrained_path: /data1/dreamzero-pretrained/Wan2.1-CLIP/models_clip_open-clip-xlm-roberta-large-vit-huge-14.pth
    text_encoder_pretrained_path: /data1/dreamzero-pretrained/Wan2.2-TI2V-5B/models_t5_umt5-xxl-enc-bf16.pth
    vae_pretrained_path: /data1/dreamzero-pretrained/Wan2.2-TI2V-5B/Wan2.2_VAE.pth
    metadata_json_path: /data1/dreamzero-config/metadata_00073.json
    action_horizon: 16
    num_action_per_block: 16
    target_video_height: 176
    target_video_width: 320

    is_lora: False
    embodiment_tag: "tong_dual_arm"
    relative_action: False
    relative_action_per_horizon: False
    default_instruction: "Perform the manipulation task."

    action_head_cfg:
      config:
        action_loss_embodiment_ids:
        - 26
        - 21
        - 17
        - 22

  optim:
    lr: 1.0e-5
    adam_beta1: 0.95
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 1.0e-5
    clip_grad: 1.0
    lr_scheduler: "cosine"
    lr_warmup_steps: -1
    lr_warmup_steps_ratio: 0.05
    total_training_steps: 50000
  fsdp_config:
    strategy: "fsdp2"
    use_orig_params: True
    gradient_checkpointing: True
    gradient_checkpointing_use_reentrant: True
    limit_all_gathers: False
    forward_prefetch: True
    backward_prefetch: "pre"
    reshard_after_forward: False
    save_full_model_weights: False
    grad_scaler:
      enabled: False
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      buffer_dtype: bf16
    amp_autocast:
      enabled: False
      precision: "bf16"
