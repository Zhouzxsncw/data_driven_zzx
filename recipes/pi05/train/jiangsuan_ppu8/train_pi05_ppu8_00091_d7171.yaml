# 天翼云 cty-19 · 8×ZW-M890P π0.5 · 00091 原生 15Hz · 动作槽 [7, -1, 7, -1]
# 落盘仍是 [左7 | 右7 | 左爪 | 右爪]。interleave_grippers 先重排成
# [左7 | 左爪 | 右7 | 右爪]，关节做增量、夹爪保持绝对。
# 归一化方法仍是 quantile。stats 写在 assets/00091_rgb_d7171，不覆盖数据集根目录。
# 其余沿用 configs/train_pi05_ppu8_00091.yaml：bs384 / lr 1.5e-4 / ah50 / warmup 1334。
config_name: pi05_aloha
framework: pytorch

exp_name: 00091_PI05_cty19_bs384_ah50_d7171
project_name: openpi
checkpoint_base_dir: /workspace/outputs
assets_base_dir: ./assets

batch_size: 384
num_epochs: 10
seed: 42
num_workers: 8
log_interval: 100
save_every_epochs: 5
keep_period: 5000
overwrite: false
resume: false
wandb_enabled: false
fsdp_devices: 8
ema_decay: 0.99

pytorch_training_precision: bfloat16
pytorch_weight_path: /workspace/openpi/models/pi05_fixed

model:
  action_horizon: 50

lr_schedule:
  warmup_steps: 250
  peak_lr: 1.0e-4
  decay_lr: 1.0e-5
  decay_steps: 54300

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

data:
  repo_id: /workspace/openpi/datasets/00091_20260903_RM_01_yj_21
  assets:
    assets_dir: /workspace/openpi/assets/00091_rgb_d7171
    asset_id: "."
  default_prompt: "Using both hands, pull open the drawer with the blue handle using your left hand, take out the white medicine box with your right hand, place it into the green drawer, and finally close the drawer."
  prompt_from_task: true
  prompt_from_subtask: false
  adapt_to_pi: false
  delta_action_dims: [7, -1, 7, -1]
  interleave_grippers: true
