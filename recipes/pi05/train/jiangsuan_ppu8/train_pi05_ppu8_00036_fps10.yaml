# 天翼云 cty-19 · 8×ZW-M890P 一路。00036 抽成 10Hz（100ms 一步）。
# 33624 帧 → 87 step/epoch × 100 epoch。启动时 resolve_epoch_schedule 会把 decay_steps 改成这个步数。
# 超参同现役 ppu8：global 384、peak 1.5e-4、warmup 1334、cosine 收到 0.1×。
# 启动：YAML=configs/train_pi05_ppu8_00036_fps10.yaml GPUS=0,1,2,3,4,5,6,7 PORT=29701 \
#       NPROC=8 LOG=/workspace/openpi/train_00036_ppu8_fps10.log bash scripts/start_train_ppu8.sh
config_name: pi05_aloha
framework: pytorch

exp_name: 00036_PI05_ppu8_bs384_ah50_fps10_20260927
project_name: openpi
checkpoint_base_dir: /workspace/outputs
assets_base_dir: ./assets

batch_size: 384
num_epochs: 10
seed: 42
num_workers: 8
log_interval: 100
save_every_epochs: 10
keep_period: 5000
overwrite: false
resume: false
wandb_enabled: false
fsdp_devices: 8
ema_decay: 0.99

pytorch_training_precision: bfloat16
pytorch_weight_path: /workspace/openpi/models/pi05_fixed

model:
  action_horizon: 50

lr_schedule:
  warmup_steps: 250
  peak_lr: 1.0e-4
  decay_lr: 1.0e-5
  decay_steps: 8700

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

data:
  repo_id: /workspace/openpi/datasets/00036_20260804_RM_01_yj_21_fps10
  assets:
    assets_dir: /workspace/openpi/datasets/00036_20260804_RM_01_yj_21_fps10
    asset_id: "."
  default_prompt: "With both hands, pick up the yellow banana and the yellow lemon and put them into the black box; then take the green vegetables and place them into the blue box."
  prompt_from_task: true
  prompt_from_subtask: false
  adapt_to_pi: false
  delta_action_dims: [7, 7, -1, -1]
