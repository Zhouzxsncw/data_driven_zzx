# TongBot 00091 smoke test — 3 step、不保存 checkpoint（规避 DeepSpeed save 卡死）
# 用法: NPROC=8 CONFIG_FILE=configs/tongbot_00091_smoke.yaml bash /data1/motus/recipes/launch_train_h100.sh
common:
  action_dim: 16
  state_dim: 16
  num_video_frames: 8
  video_height: 384
  video_width: 320
  global_downsample_rate: 3
  video_action_freq_ratio: 2

dataset:
  type: "lerobot"
  max_episodes: null
  image_aug: false
  task_mode: "multi"
  # multi 模式下 root 必须是父目录（os.listdir(root) 枚举 task），task_name 精确指定
  task_name: "00091_20260903_RM_01_yj_21"
  params:
    repo_id: "00091_20260903_RM_01_yj_21"
    root: "/data1/dataset"
    embodiment_type: "tong_dual_arm_00091"
    enable_t5_fallback: true
    t5_wan_path: "/data1/motus/Motus/pretrained_models"
    t5_folder_name: "t5_embedding"
    t5_text_len: 512

model:
  wan:
    config_path: "/data1/motus/Motus/pretrained_models/Motus_Wan2_2_5B_pretrain"
    checkpoint_path: "/data1/motus/Motus/pretrained_models/Motus_Wan2_2_5B_pretrain"
    vae_path: "/data1/motus/Motus/pretrained_models/Wan2.2-TI2V-5B/Wan2.2_VAE.pth"
    precision: "bfloat16"
  vlm:
    checkpoint_path: "/data1/motus/Motus/pretrained_models/Qwen3-VL-2B-Instruct"
    config_path: "/data1/motus/Motus/pretrained_models/Qwen3-VL-2B-Instruct"
    precision: "bfloat16"
    frozen: true
  action_expert:
    hidden_size: 1024
    ffn_dim_multiplier: 4
    norm_eps: 1e-5
  und_expert:
    hidden_size: 512
    ffn_dim_multiplier: 4
    norm_eps: 1e-5
    vlm:
      input_dim: 2048
      projector_type: "mlp3x_silu"
  time_distribution:
    timestep_sample_method: "logit_normal"
    sigmoid_scale: 1.0
    min_t: 0.0
    max_t: 1.0
  inference:
    num_inference_timesteps: 10
  loss_weights:
    video_loss_weight: 1.0
    action_loss_weight: 1.0
  ema:
    enabled: false
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999

training:
  batch_size: 4
  max_steps: 3
  learning_rate: 5.0e-5
  weight_decay: 0.01
  scheduler_type: "linear"
  warmup_steps: 200
  cycle_length: 5000000
  f_max: 0.99
  f_min: 0.4
  grad_clip_norm: 0.5
  use_amp: true
  find_unused_parameters: false

system:
  checkpoint_dir: "/data1/motus/outputs/00091_smoke/checkpoints"
  log_level: "INFO"
  log_interval: 1
  save_interval: 100000
  val_interval: 100000
  num_workers: 8
  pin_memory: true

logging:
  report_to: "tensorboard"
  wandb_project: "motus"
  tensorboard_log_dir: "/data1/motus/outputs/00091_smoke/tensorboard"
  run_name: "tongbot_00091_smoke"

resume:
  checkpoint_path: null

finetune:
  checkpoint_path: /data1/motus/Motus/pretrained_models/Motus
