# π0.5 华为块长 90。mix_108_36_91_73，三路相机，fixbase，全局 batch 256，lr 9.9e-5。
# 验证名单 meta/episode_split.json。每个 epoch 记一次 valid，连续 5 次不创新低就停。
config_name: pi05_aloha
framework: pytorch

exp_name: mix_108_36_91_73_PI05_a2_h90_fixbase
project_name: openpi
checkpoint_base_dir: /home/pi05/ckpt_on_software
assets_base_dir: ./assets

batch_size: 256
num_epochs: 10
seed: 42
num_workers: 8
log_interval: 50
save_every_epochs: 1
keep_period: 5000
overwrite: false
resume: false
wandb_enabled: false
fsdp_devices: 8
ema_decay: 0.99

pytorch_training_precision: bfloat16
pytorch_weight_path: /home/pi05/models

model:
  action_horizon: 90

lr_schedule:
  warmup_steps: 250
  peak_lr: 1.0e-4
  decay_lr: 1.0e-5
  decay_steps: 300000

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

data:
  repo_id: /home/pi05/mix_108_36_91_73
  assets:
    assets_dir: /home/pi05/mix_108_36_91_73
    asset_id: "."
  default_prompt: "With both hands, pick up the yellow banana and the yellow lemon and put them into the black box; then take the green vegetables and place them into the blue box."
  prompt_from_task: true
  prompt_from_subtask: false
  adapt_to_pi: false
  use_delta_joint_actions: true
  delta_action_dims: [7, -1, 7, -1]
  interleave_grippers: true
  val_ratio: 0.1
  val_seed: 42
  vector_norm: quantile
  image_keys:
    - observation.images.front
    - observation.images.left
    - observation.images.right
  drop_cameras: []
