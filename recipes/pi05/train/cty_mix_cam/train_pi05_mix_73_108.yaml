# π0.5 mix_73_108，cty-18，原生 15Hz，不抽帧。
# 00073 快递 630 条 + 00108 果蔬 200 条，共 830 条 / 218563 帧。
# 三路相机都开。验证名单 meta/episode_split.json，seed 42，val_ratio 0.1。
# 归一化写在 assets/mix_73_108_d7171，只含训练 episode，不覆盖数据集。
# 每个 epoch 存一次。最新 5 个数字检查点。早停 patience 5。
# decay_steps 由 num_epochs 按数据集长度在启动时改写。
config_name: pi05_aloha
framework: pytorch

exp_name: mix_73_108_PI05_cty18_bs384_ah50_fps15
project_name: openpi
checkpoint_base_dir: /workspace/outputs
assets_base_dir: ./assets

batch_size: 384
num_epochs: 10
seed: 42
num_workers: 8
log_interval: 100
save_every_epochs: 1
keep_period: 5000
overwrite: false
resume: false
wandb_enabled: false
fsdp_devices: 8
ema_decay: 0.99

pytorch_training_precision: bfloat16
pytorch_weight_path: /workspace/openpi/models/pi05_fixed

model:
  action_horizon: 50

lr_schedule:
  warmup_steps: 250
  peak_lr: 1.0e-4
  decay_lr: 1.0e-5
  decay_steps: 124300

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

data:
  repo_id: /workspace/openpi/datasets/mix_73_108
  target_fps: 15
  assets:
    assets_dir: /workspace/openpi/assets/mix_73_108_d7171
    asset_id: "."
  default_prompt: "Using both hands, pick up the courier items from the green conveyor belt. Place the white courier bags into the left box and the brown courier boxes into the right box."
  prompt_from_task: true
  prompt_from_subtask: false
  adapt_to_pi: false
  delta_action_dims: [7, -1, 7, -1]
  interleave_grippers: true
  val_ratio: 0.1
  val_seed: 42
  image_keys:
    - observation.images.front
    - observation.images.left
    - observation.images.right
  drop_cameras: []
