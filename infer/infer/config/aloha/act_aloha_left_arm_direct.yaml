# =============================================================================
# 原生 ALOHA ACT 单臂批量推理 — 全部配置只改本文件，然后:
#   python3 infer/cli/run_batch_infer.py --config infer/config/aloha/act_aloha_left_arm_direct.yaml
# =============================================================================
# 与 act_left_arm.yaml 的区别：
#   - engine: native（与 Pi0.5 批量推理共用 run_batch_infer.py / InferEngine）
#   - direct_robot.enabled=true（机械臂直连）
#   - gripper_mode=udp 时仍需下位机运行 only_gripper.py
#   - 相机默认由本进程本地直读
# 实习生/老师常用改动：
#   - policy.ckpt_dir / dataset_repo_id / dataset_root
#   - policy.tasks_per_group
#   - batch_infer.vla_auto_eval         action-step 组结束后自动评估（eval_table/）
#   - pedal / network / camera_sender / direct_robot
#   - exo_safety.enabled=true 时 Ctrl+1 外骨骼接管、Ctrl+2 恢复推理（下位机需 run.py 非 gripper-only）
# 说明：ACT 不使用 language prompt；OOD 阶段仍会切换 task_prompt 并填评分表，
#       但模型推理仅依赖图像与状态（与单次 ACT 推理一致）。
# =============================================================================

experiment_name: aloha_act_left_arm_pick_place_direct

engine: native

policy:
  type: act
  # lerobot: 原有 pretrained_model；aloha: 原生 ALOHA policy.py + .ckpt + dataset_stats.pkl
  act_backend: aloha
  ckpt_dir: /path/to/aloha_act_checkpoint_dir
  tasks_per_group: 20
  task_prompt: "Use the left gripper to pick up the toy and put it into the box."
  n_action_steps_override: 15
  keep_dims: [0, 1, 2, 3, 4, 5, 6, 14]
  camera_keys: [observation.cam_left, observation.cam_mid]
  action_scale: 1.0
  action_clip_abs: null
  aloha_checkpoint_name: policy_best.ckpt
  aloha_stats_path: null  # null = checkpoint 同目录 dataset_stats.pkl
  aloha_model_args:       # TongBot：arm_joint_state_dim 固定为 8；须与训练该 ckpt 一致
    chunk_size: 32
    qpos_norm_mode: 2
    camera_color_names: [left, front]
    obs_history_num: 1
    arm_joint_state_names: [left]
    arm_joint_state_dim: 8
    use_arm_joint_state: 3
    hidden_dim: 512
    dim_feedforward: 3200
    enc_layers: 4
    dec_layers: 7
    nheads: 8

network:
  high_host: "192.168.1.12"
  low_host: "192.168.1.13"
  state_port: 18132
  control_port: 30005
  gripper_port: 30015
  gripper_state_port: 30016
  camera_port: 18888

camera_sender:
  enabled: true
  transport: local
  target_host: null
  target_port: null
  jpeg_quality: 95
  use_host_timestamp: true
  get_timeout_sec: 3.0
  reconnect_delay_sec: 0.5
  devices:
    # devices[0]=observation.cam_left（左腕）, devices[1]=observation.cam_mid（胸前）
    # devices[].key 可显式绑定 checkpoint feature；省略时按下标对应 infer 相机 key 顺序
    # 单相机时只保留一路；不要用 `- null` 占位第二路
    # width/height 省略：启动时自动从 checkpoint config.json 读取
    - serial: "f1480854"
      width: 640
      height: 480
      fps: 30
    - serial: "f1420947"
      width: 640
      height: 480
      fps: 30

direct_robot:
  enabled: true
  sdk_path: ~/RM_API2-main
  gripper_mode: udp
  # 模型输入夹爪 state[14]：
  #   udp    = 推理帧最新下位机 UDP 实测（30016）
  #   buffer = 同步缓冲池对齐值；若该维缺失/占位 0，则回退上一拍 action 夹爪，不用 0
  gripper_state_source: udp
  gripper_initial_position: [0.7, 0.7]
  reset_to_init_on_group_start: true
  # dataset_median：从训练集各 episode 首帧取中位数，覆盖左臂/夹爪（右臂保留 standard）
  # ALOHA dataset_stats.pkl 不含 episode 首帧；没有 LeRobot dataset_root 时用 standard。
  init_pose_source: standard
  random_task_init_pose: false
  random_task_init_radius_m: 0.10
  random_task_init_max_attempts: 32
  standard_init_joint_degrees:
    - 0.0
    - 2.5
    - 0.0
    - -103.0
    - -73.67
    - 89.0
    - -8.31
    - -22.0
    - -75.5
    - 76.4
    - 9.8
    - 82.1
    - -14.9
    - 12.1
    - 2.59
    - -29.4
    - 200.6
  reset_move_speed: 10
  reset_settle_sec: 1.5
  robot_r_host: "192.168.1.17"
  robot_l_host: "192.168.1.18"
  port_r: 8080
  port_l: 8080
  enable_joint: [false, false, false]
  left_gripper_kwargs:
    dxl_name: XM430
    Device_name: /dev/ttyUSB0
    dxl_id: 1
    baudrate: 4000000
    min_position: 1395
    max_position: 2043
  right_gripper_kwargs: null
  state_poll_hz: 100.0

sync:
  max_time_diff: null
  sync_delay: 0.05
  buffer_size: 1000
  prefill_sec: 2.0
  min_anchor_buffer: 5
  clock_offset:
    robot_state: 0.0
    camera: 0.0

recording:
  enabled: true
  save_videos: true
  save_trajectory: true
  save_third_cam: true
  save_fourth_cam: true
  inference_dir: null
  generate_debug_plot: true
  debug_plot_max_dims: 8
  debug_plot_dpi: 160
  golden_capture: false
  golden_capture_dir: null
  golden_capture_mode: policy

session:
  fps: 15
  max_tests: null
  max_duration_sec: null
  prompt_continue: true
  auto_finalize: true
  task_mode: continuous_tasks
  pedal_task_control: true
  visualize_cam_left: true
  visualize_cam_mid: true
  cam_left_window_name: cam_left
  cam_mid_window_name: cam_mid

pedal:
  task_toggle: ctrl+.
  confirm: y
  cancel: n
  discard: delete
  exo_takeover: ctrl+1      # 外骨骼接管（需 exo_safety.enabled=true）
  exo_safety_infer: ctrl+2  # 恢复推理

exo_safety:
  enabled: true
  exo_state_port: 18140
  exo_command_port: 30026
  collect_config: ../../../data_collect/config/left_arm_gripper_2cam.yaml
  # 选数采后延迟开录：先弹中间相机窗口不播放，到点后写帧并同步预览
  record_start_delay_sec: 2.0
  collect_cam_mid_window_name: exo_collect_cam_mid

logging:
  level: INFO
  human_log_level: INFO
  file_log_level: INFO
  log_sync_every_n_frames: 30
  log_action_steps_detail: false
  machine_flow_enabled: true
  alerts_enabled: true
  log_file: null

evaluation:
  enabled: true
  auto_after_each_test: true
  save_report: true
  report_filename: evaluation_report.json
  metrics: [automatic]
  labels_file: null
  sync_warn_rate_threshold: 0.30
  eval_log_enabled: true
  eval_log_filename: eval_log.jsonl
  eval_log_save_images: false
  eval_log_image_dir: eval_images
  eval_log_image_format: jpg
  eval_log_save_videos: false
  eval_log_video_dir: eval_videos
  eval_log_generate_plots: true
  eval_log_plot_dir: eval_plots
  eval_log_plot_dpi: 150

ablation:
  enabled: false

batch_infer:
  action_step_parts: 5
  phase: action-step
  ood_tasks_per_group: 1
  output_dir: null
  best_action_step: null
  skip_existing: false
  # ACT/DP 不使用 OOD；保留字段无影响
  ood_presets: null
  # true：每组自动生成 WPS 评分表 .et；false：跳过（无 WPS 或调试时）
  feedback_score_sheet: true

  # action-step 每组结束后自动评估（vla_eval），产物写入 <action-step_xx>/eval_table/
  vla_auto_eval:
    enabled: true
    # table_template: null   # 默认 vla_eval/template/评测表.et
    # config: null           # 默认 vla_eval/config/config_scored.yaml
    output_dirname: eval_table
    result_table_name: eval_result.et
    summary_name: summary.md

  remote_sync:
    enabled: false
    host: "10.151.43.132"
    port: 22
    username: "xk"
    remote_dir: "/home/xk/CQTongBot/research/ablation/runs/real"
    private_key_path: ~/.ssh/id_ed25519
