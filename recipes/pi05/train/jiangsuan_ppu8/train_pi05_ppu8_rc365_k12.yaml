# 江算-16b 槽 B · 8×PPU · RoboCasa365 k=12。前 12 个任务（加 OpenCabinet…CloseToasterOvenDoor）。从 pi05_fixed 单独开。
# 动作和相机同 k=1。norm_stats 是这一档自己的。
config_name: pi05_aloha_rgb
framework: pytorch

exp_name: rc365_PI05_k12
project_name: openpi
checkpoint_base_dir: /workspace/openpi/checkpoints
assets_base_dir: /workspace/openpi/datasets/rc365_PI05_k12

batch_size: 384
num_epochs: 10
seed: 42
num_workers: 8
log_interval: 50
save_every_epochs: 1
keep_period: 5000
overwrite: false
resume: false
wandb_enabled: false
fsdp_devices: 8
ema_decay: 0.99

pytorch_training_precision: bfloat16
pytorch_weight_path: /workspace/openpi/models/pi05_fixed

model:
  action_horizon: 50

lr_schedule:
  warmup_steps: 250
  peak_lr: 1.0e-4
  decay_lr: 1.0e-5

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

data:
  repo_id: /workspace/openpi/datasets/rc365_PI05_k12
  assets:
    assets_dir: /workspace/openpi/datasets/rc365_PI05_k12
    asset_id: "."
  default_prompt: "open the drawer"
  prompt_from_task: true
  prompt_from_subtask: false
  adapt_to_pi: false
  use_delta_joint_actions: false
  interleave_grippers: false
  delta_action_dims: [-12]
  image_keys:
    - observation.images.robot0_agentview_left
    - observation.images.robot0_agentview_right
    - observation.images.robot0_eye_in_hand
