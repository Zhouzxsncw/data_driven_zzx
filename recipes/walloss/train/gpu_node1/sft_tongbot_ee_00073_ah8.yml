# gpu-node1 单卡 WALL-OSS-0.5 SFT · TongBot 00073 相对 EE
# CHUNK SIZE / action_horizon = 8
#
# 对齐江算 00073 EE 配方：lr 5e-5 / warmup 200 / 全局 batch 64 / cosine 30000 step
# 单卡用 16×accum4 = 64。AH=8 必须写在 data: 里，update_model_config 只读 data.action_horizon_flow。
# num_workers=1 + prefetch_factor=1：避免解码 worker 把主机内存/swap 吃光。
#
# 启动: bash /data/wall-oss/code/train/start_train_00073_ah8.sh
model_type: qwen2_5

task:
  dof_config:
    follow_left_ee_cartesian_pos_relative: 3
    follow_left_ee_rotation_6D_relative: 6
    follow_left_gripper: 1
    follow_right_ee_cartesian_pos_relative: 3
    follow_right_ee_rotation_6D_relative: 6
    follow_right_gripper: 1
    action_padding: 6
  ar_dof_config:
    follow_left_ee_cartesian_pos_relative: 3
    follow_left_ee_rotation_6D_relative: 6
    follow_left_gripper: 1
    follow_right_ee_cartesian_pos_relative: 3
    follow_right_ee_rotation_6D_relative: 6
    follow_right_gripper: 1
    action_padding: 6
  agent_pos_config:
    follow_left_ee_cartesian_pos: 3
    follow_left_ee_rotation_6D: 6
    follow_left_gripper: 1
    follow_right_ee_cartesian_pos: 3
    follow_right_ee_rotation_6D: 6
    follow_right_gripper: 1
    action_padding: 6
  action_horizon: 8
  action_horizon_flow: 8
  use_state_string_representation: false

model:
  backbone: qwen2_5
  config_path: /data/wall-oss/pretrained/wall-oss-0.5/config.json
  processor_path: /data/wall-oss/pretrained/Qwen2.5-VL-3B-Instruct
  pretrained_path: /data/wall-oss/pretrained/wall-oss-0.5
  attn_deterministic: true
  use_ema: false
  flow_loss_weight: 1.0
  ar_loss_weight: 0.01
  enable_customized_robot_config: false

hyperparams:
  num_epoch: 10
  batch_size_per_gpu: 16
  gradient_accumulation_steps: 4
  seed: 10233
  optimizer:
    optimizer_type: adamw
    learning_rate: 5.0e-05
    max_grad_norm: 1.0
    enable_grad_clip: true
    betas: [0.9, 0.95]
    weight_decay: 1.0e-8
    eps: 1.0e-8
  scheduler:
    scheduler_type: cosine
    num_warmup_steps: 200
    num_training_steps: 30000
    min_lr: 1.0e-6

distributed:
  use_fsdp: true
  use_mixed_precision: true
  bf16: true
  use_gradient_checkpointing: true

data:
  dataset_type: lerobot
  lerobot_config:
    repo_id: /data/wall-oss/datasets/00073_rm75_ee_v30
    root: null
  key_mappings:
    camera:
      observation.images.front: face_view
      observation.images.left: left_wrist_view
      observation.images.right: right_wrist_view
    state: observation.state.ee
    action: action.ee
  # 必须写在 data: 里：model_config.update_model_config 只读 data.action_horizon_flow
  action_horizon: 8
  action_horizon_flow: 8
  norm_stats_path: /data/wall-oss/datasets/00073_rm75_ee_v30/meta/walloss_norm_stats.json
  train_test_split: 0.95
  num_workers: 1
  prefetch_factor: 1
  max_length: 1024
  resolution:
    face_view: 256
    left_wrist_view: 256
    right_wrist_view: 256

logging:
  log_name: walloss05_tongbot_ee_00073_ah8
  log_project: walloss
  log_entity: null
  use_wandb: false
  log_interval: 10
  save_interval: 5000
  val_interval: 2000
  epoch_save_interval: 1

checkpoint:
  save_path: /data/wall-oss/outputs/walloss05_tongbot_ee_00073_ah8
  resume_from: /data/wall-oss/pretrained/wall-oss-0.5/model.safetensors

debug:
  profile: false
  nvtx: false
