# π0.5 8×Ascend 00108 rgb_ft AH=50 fixbase。bs128 / 16 per NPU / lr 7e-5。
config_name: pi05_aloha_rgb_ft
framework: pytorch

exp_name: 00108_PI05_npu8_bs128_lr7e-5_ah50_rgb_ft_fixbase
project_name: openpi
checkpoint_base_dir: ./checkpoints
assets_base_dir: ./assets

batch_size: 128
num_epochs: 10
seed: 42
num_workers: 16
log_interval: 50

save_every_epochs: null
save_interval: 2000
save_full_every_epochs: null
keep_period: 5000
overwrite: false
resume: false
wandb_enabled: false
fsdp_devices: 8
ema_decay: 0.99

pytorch_training_precision: bfloat16
pytorch_weight_path: /home/pi05/models

model:
  action_horizon: 50

lr_schedule:
  warmup_steps: 250
  peak_lr: 1.0e-4
  decay_lr: 1.0e-5
  decay_steps: 18900

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

data:
  repo_id: /home/pi05/00108_20260922_RM_01_YJ_v21
  assets:
    assets_dir: /home/pi05/00108_20260922_RM_01_YJ_v21
    asset_id: "."
  default_prompt: "With both hands, pick up the yellow banana and the yellow lemon and put them into the black box; then take the green vegetables and place them into the blue box."
  prompt_from_task: true
  prompt_from_subtask: false
  append_modality_prompt: true
  # 盘上暂用全称。正在跑的 00108 FT 进程仍是 "FT LEFT: " / "FT RIGHT: "。
  # 推理对齐那批 ckpt 用旧文案，不要改 infer 去吃 FORCE TORQUE。
  modality_prompt_tags:
    force6d.left: "FORCE TORQUE LEFT: "
    force6d.right: "FORCE TORQUE RIGHT: "
  adapt_to_pi: false
  delta_action_dims: [7, 7, -1, -1]
  visual_norm: siglip
  max_depth_mm: 4000.0
  vector_norm: quantile

