# A3 一路 16 卡（NPU 0-15）。每卡仍 16 样本（再加倍到 32/卡会 OOM）。
# global batch 256；peak_lr = 2.5e-5 × sqrt(16) = 1e-4；decay = 0.1×。
# epoch 与 8 卡相同，decay_steps 按 batch 反比减半，样本曝光不变。
# 旧 8 卡实验留在 huawei_npu8/，不要用这份 resume 那些 exp_name。
#   num_epochs 25 不变 ⇒ 1517 步/ep × 25 = 37925 步，样本曝光 4.86M 与 npu16 run 一致
config_name: pi05_aloha
framework: pytorch

exp_name: 00073_PI05_npu16_bs256_lr1e-4_ah50_fixbase
project_name: openpi
checkpoint_base_dir: ./checkpoints
assets_base_dir: ./assets

batch_size: 256          # TOTAL across 16 NPUs = 16 per NPU
num_epochs: 10
seed: 42
num_workers: 16
log_interval: 50

save_every_epochs: null
save_interval: 2000
save_full_every_epochs: null
keep_period: 5000
overwrite: true
resume: false
wandb_enabled: false
fsdp_devices: 16
ema_decay: 0.99

pytorch_training_precision: bfloat16
pytorch_weight_path: /home/pi05/models

model:
  action_horizon: 50

lr_schedule:
  warmup_steps: 250
  peak_lr: 1.0e-4
  decay_lr: 1.0e-5
  decay_steps: 19000      # 8 卡步数 38000 按 batch 128→256 减半；epoch 不变

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

data:
  repo_id: /home/pi05/00073_20260818_RM_01_yj_21
  assets:
    assets_dir: /home/pi05/00073_20260818_RM_01_yj_21
    asset_id: "."
  default_prompt: "Using both hands, pick up the courier items from the green conveyor belt. Place the white courier bags into the left box and the brown courier boxes into the right box."
  prompt_from_task: true
  prompt_from_subtask: false
  adapt_to_pi: false
  delta_action_dims: [7, 7, -1, -1]
