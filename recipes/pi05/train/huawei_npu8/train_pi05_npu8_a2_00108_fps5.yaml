# A2 一路 8 卡。npu-smi HBM 65536 MiB。
# 旧 16/卡大约占 60%（00036 ah16 sidecar mem_used_mib_avg=39286）。
# 每卡 24，global 192，相对 16/卡乘 √(24/16)=√1.5，往 90% 靠，不开 32/卡。
# norm_stats 是 fps5 降采样之后重算的，不是 15Hz 那份。
#   python3 scripts/compute_norm_stats_parquet.py --dataset <fps5> --batch 192
config_name: pi05_aloha_rgb
framework: pytorch

exp_name: 00108_PI05_a2npu8_bs192_lr8.57e-5_ah50_fps5_fixbase
project_name: openpi
checkpoint_base_dir: /home/software/pi05/checkpoints
assets_base_dir: ./assets

batch_size: 192          # 8 NPU × 24
num_epochs: 10
seed: 42
num_workers: 8
log_interval: 50

save_every_epochs: null
save_interval: 1000
save_full_every_epochs: null
keep_period: 5000
overwrite: false
resume: false
wandb_enabled: false
fsdp_devices: 8
ema_decay: 0.99

pytorch_training_precision: bfloat16
pytorch_weight_path: /home/pi05/models

model:
  action_horizon: 50

lr_schedule:
  warmup_steps: 250
  peak_lr: 1.0e-4
  decay_lr: 1.0e-5
  decay_steps: 4200       # 8100//192 = 42 步/epoch × 100

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

data:
  repo_id: /home/software/dataset/00108_20260922_RM_01_YJ_v21_fps5
  assets:
    assets_dir: /home/software/dataset/00108_20260922_RM_01_YJ_v21_fps5
    asset_id: "."
  default_prompt: "With both hands, pick up the yellow banana and the yellow lemon and put them into the black box; then take the green vegetables and place them into the blue box."
  prompt_from_task: true
  prompt_from_subtask: false
  append_modality_prompt: false
  modality_prompt_tags: {}
  adapt_to_pi: false
  delta_action_dims: [7, 7, -1, -1]
  visual_norm: siglip
  max_depth_mm: 4000.0
  vector_norm: quantile
