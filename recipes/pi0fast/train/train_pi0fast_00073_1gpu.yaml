# PI0-FAST TongBot 00073 / gpu-node1 单卡（RTX PRO 6000 96GB，X-VLA 结束后独占）
# 预设: recipes/pi0fast/train/patch_config_fast_tongbot.py 注册的 pi0_fast_tongbot
# 关键决策:
#   - action_horizon=15 / max_token_len=280（FAST tokenize 实测 16D×15≈250 token；h=50 需 572 超限）
#   - batch_size 32：独占 96GB 全参训练（FAST 无 action expert，显存压力小于 PI05）
#   - 00073 共 194273 帧 / 630 eps；30000 step ≈ bs32 下 ~4.9 epoch
#   - save_full_interval 10000：常规 save 仅写推理 params（轻量），full 才写 optimizer state
config_name: pi0_fast_tongbot
framework: jax

exp_name: 00073_pi0fast_bs32_lr2.5e-5_ah15_1gpu
project_name: openpi
checkpoint_base_dir: ./checkpoints
assets_base_dir: ./assets

batch_size: 32
num_train_steps: 30000
seed: 42
num_workers: 8
log_interval: 50
save_interval: 2000
save_full_interval: 10000
keep_period: 4000
overwrite: false
resume: false
wandb_enabled: false
fsdp_devices: 1
ema_decay: 0.99

model:
  action_horizon: 15
  max_token_len: 280

lr_schedule:
  warmup_steps: 1000
  peak_lr: 2.5e-5
  decay_steps: 30000
  decay_lr: 2.5e-6

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

data:
  repo_id: /home/cqcigai/datasets/00073_20260818_RM_01_yj_21
  assets:
    assets_dir: /home/cqcigai/datasets/00073_20260818_RM_01_yj_21
    asset_id: "."
  default_prompt: "Using both hands, pick up the courier items from the green conveyor belt. Place the white courier bags into the left box and the brown courier boxes into the right box."
  prompt_from_task: true
  prompt_from_subtask: false
  adapt_to_pi: false
  delta_action_dims: [7, 7, -1, -1]
