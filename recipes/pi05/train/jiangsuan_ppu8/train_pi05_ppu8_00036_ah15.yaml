# 江算-16/16b/16c · 8×PPU 一路。00036 水果蔬菜 · AH=15。
# 50440 帧 → 131 step/ep × 100 = 13100 step。超参同 ppu8（global 384 / lr 1.5e-4）。
# 槽 A：YAML=configs/train_pi05_ppu8_00036_ah15.yaml GPUS=0,1,2,3,4,5,6,7 PORT=29701 \
#       NPROC=8 LOG=/workspace/openpi/train_00036_ppu8_ah15.log bash scripts/start_train_ppu8.sh
config_name: pi05_aloha
framework: pytorch

exp_name: 00036_PI05_js8_bs384_lr1.5e-4_ah15_fixbase
project_name: openpi
checkpoint_base_dir: ./checkpoints
assets_base_dir: ./assets

batch_size: 384
num_epochs: 10
seed: 42
num_workers: 8
log_interval: 100
save_every_epochs: 10
keep_period: 5000
overwrite: false
resume: false
wandb_enabled: false
fsdp_devices: 8
ema_decay: 0.99

pytorch_training_precision: bfloat16
pytorch_weight_path: /workspace/openpi/models/pi05_fixed

model:
  action_horizon: 15

lr_schedule:
  warmup_steps: 250
  peak_lr: 1.0e-4
  decay_lr: 1.0e-5
  decay_steps: 13100

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

data:
  repo_id: /workspace/openpi/datasets/00036_20260804_RM_01_yj_21
  assets:
    assets_dir: /workspace/openpi/datasets/00036_20260804_RM_01_yj_21
    asset_id: "."
  default_prompt: "With both hands, pick up the yellow banana and the yellow lemon and put them into the black box; then take the green vegetables and place them into the blue box."
  prompt_from_task: true
  prompt_from_subtask: false
  adapt_to_pi: false
  delta_action_dims: [7, 7, -1, -1]
