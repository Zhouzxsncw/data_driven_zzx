# 江算-16b 槽 B · 8×PPU 00073 快递分拣 AH=50 fixbase。
# 对照 quantile 配方，只把 post-train 向量归一化改成 zscore（mean/std）。
# state+action 一起变。stats 仍用数据集根目录已有 norm_stats.json，不必重算。
# 194273 帧 → 506 step/ep × 100 = 50600 step。bs384 / lr 1.5e-4。
config_name: pi05_aloha
framework: pytorch

exp_name: 00073_PI05_js8_bs384_lr1.5e-4_ah50_zscore_fixbase
project_name: openpi
checkpoint_base_dir: ./checkpoints
assets_base_dir: ./assets

batch_size: 384
num_epochs: 10
seed: 42
num_workers: 8
log_interval: 100
save_every_epochs: 10
keep_period: 5000
overwrite: false
resume: false
wandb_enabled: false
fsdp_devices: 8
ema_decay: 0.99

pytorch_training_precision: bfloat16
pytorch_weight_path: /workspace/openpi/models/pi05_fixed

model:
  action_horizon: 50

lr_schedule:
  warmup_steps: 250
  peak_lr: 1.0e-4
  decay_lr: 1.0e-5
  decay_steps: 50600

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

data:
  repo_id: /workspace/openpi/datasets/00073_20260818_RM_01_yj_21
  assets:
    assets_dir: /workspace/openpi/datasets/00073_20260818_RM_01_yj_21
    asset_id: "."
  default_prompt: "Using both hands, pick up the courier items from the green conveyor belt. Place the white courier bags into the left box and the brown courier boxes into the right box."
  prompt_from_task: true
  prompt_from_subtask: false
  adapt_to_pi: false
  delta_action_dims: [7, 7, -1, -1]
  vector_norm: zscore
